[project]
name = "tda-bench"
version = "0.1.0"
description = "Scaling benchmark for the TDA crate. Not part of the published library."
requires-python = ">=3.11"
dependencies = [
    "tda",
    "numpy>=2.0",
    "psutil>=6.0",
    "gudhi>=3.12",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
]

[tool.uv.sources]
tda = { path = "../crates/python" }
