[workspace]
members = ["crates/core", "crates/python"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Topological Data Analysis in Rust. Not limited to H0 and H1."
repository = "https://github.com/antonio-leitao/topological-data-analysis"
authors = ["António Leitão <aleitao@novaims.unl.pt>"]
readme = "README.md"
keywords = ["topology", "homology", "tda", "persistent-homology", "ripser"]
categories = ["mathematics", "science"]

# Keep cross-module inlining stable in the reduction loop.
[profile.release]
codegen-units = 1
lto = "fat"

# The seq-vs-par and brute-force tests reduce real filtrations, which is far
# too slow unoptimised (23s → 1.6s for the core suite). Only `opt-level` is
# overridden, so `debug-assertions` stays on — unlike `--release`, which would
# silently drop every `debug_assert!` in the engine.
[profile.test]
opt-level = 2

[profile.bench]
debug = "line-tables-only"
split-debuginfo = "packed"
strip = false

[profile.profiling]
inherits = "release"
debug = true
