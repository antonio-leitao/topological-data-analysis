[workspace]
members = ["crates/core", "crates/python"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Topological Data Analysis in Rust. Not limited to H0 and H1."
repository = "https://github.com/antonio-leitao/topological-data-analysis"
authors = ["António Leitão <aleitao@novaims.unl.pt>"]
readme = "README.md"
keywords = ["topology", "homology", "tda", "persistent-homology", "ripser"]
categories = ["mathematics", "science"]

# One codegen unit + full LTO: the hot reduction loop's cross-function
# inlining must not depend on how rustc happens to partition an ever-growing
# crate into codegen units (adding unrelated modules — e.g. coords — was
# observed to shift partitioning and cost ~10% on the engine benchmarks).
# Slower builds, deterministic codegen quality.
[profile.release]
codegen-units = 1
lto = "fat"

[profile.bench]
debug = "line-tables-only"
split-debuginfo = "packed"
strip = false

[profile.profiling]
inherits = "release"     # keep opt-level, LTO, codegen-units from release
debug = true             # add full debuginfo -> source-line attribution in samply
# debug = "line-tables-only"   # leaner alternative: line info only, faster link
# force-frame-pointers = true  # optional: extra-robust unwinding of inlined release stacks
